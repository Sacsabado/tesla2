<!DOCTYPE html>
<html lang="en"> 

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Electric car, solar and clean energy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 70px;
      width: 100%;

      background-color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 40px;

      position: relative;
      z-index: 100;
    }

    .logo {
      width: 150px;

      /* convierte el logo en negro */
      filter: brightness(0);
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav ul {
      list-style: none;

      display: flex;
      align-items: center;

      gap: 30px;
    }

    nav li {
      font-size: 15px;
      font-weight: 500;

      cursor: pointer;
    }

    .right-menu {
      display: flex;
      gap: 25px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      height: calc(100vh - 70px);

      overflow: hidden;
    }


    /* VIDEO */

    .hero video {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }


    /* pequeña capa oscura para que se vea el texto */

    .overlay {
      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, 0.12);

      z-index: 2;
    }


    /* =========================
       TEXTO
    ========================= */

    .hero-content {
      position: absolute;

      top: 90px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 3;

      color: white;

      text-align: center;

      width: 100%;
    }

    .hero-content h1 {
      font-size: 55px;
      font-weight: 600;

      margin-bottom: 10px;
    }

    .hero-content h2 {
      font-size: 22px;
      font-weight: 400;
    }


    /* =========================
       BOTONES
    ========================= */

    .buttons {
      position: absolute;

      bottom: 60px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 3;

      display: flex;

      gap: 15px;
    }

    button {
      width: 220px;

      padding: 14px;

      border: none;
      border-radius: 5px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
    }

    .primary {
      background-color: #3e6ae1;
      color: white;
    }

    .secondary {
      background-color: white;
      color: #171a20;
    }


    /* =========================
       TABLET / IPAD
    ========================= */

    @media (max-width: 1100px) {

      .main-menu {
        display: none;
      }

      header {
        padding: 0 30px;
      }

      .right-menu li:not(:last-child) {
        display: none;
      }

      .right-menu li:last-child {
        background: #f4f4f4;

        padding: 12px 20px;

        border-radius: 5px;
      }
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 60px;

        padding: 0 20px;
      }

      .logo {
        width: 120px;
      }

      .hero {
        height: calc(100vh - 60px);
      }

      .hero-content {
        top: 70px;
      }

      .hero-content h1 {
        font-size: 40px;
      }

      .hero-content h2 {
        font-size: 18px;
      }

      .buttons {
        width: 90%;

        flex-direction: column;

        bottom: 30px;
      }

      button {
        width: 100%;
      }
    }

  </style>
</head>


<body>

  <!-- HEADER -->

  <header>

    <img
      src="./tesla remove img.png"
      class="logo"
      alt="Tesla"
    >


    <nav class="main-menu">

      <ul>

        <li>Model S</li>
        <li>Model 3</li>
        <li>Model X</li>
        <li>Model Y</li>
        <li>Solar Roof</li>
        <li>Solar Panels</li>
        <li>Powerwall</li>

      </ul>

    </nav>


    <nav>

      <ul class="right-menu">

        <li>Shop</li>
        <li>Account</li>
        <li>Menu</li>

      </ul>

    </nav>

  </header>



  <!-- HERO -->

  <section class="hero">


    <!-- VIDEO DE FONDO -->

    <video
      autoplay
      muted
      loop
      playsinline
    >

      <source
        src="./video tesla (1).mp4"
        type="video/mp4"
      >

    </video>


    <!-- CAPA OSCURA -->

    <div class="overlay"></div>



    <!-- TEXTO -->

    <div class="hero-content">

      <h1>Experience Tesla</h1>

      <h2>Schedule a Demo Drive</h2>

    </div>



    <!-- BOTONES -->

    <div class="buttons">

      <button class="primary">
        Order Now
      </button>

      <button class="secondary">
        Demo Drive
      </button>

    </div>


  </section>


</body>

</html>
