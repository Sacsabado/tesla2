<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Electric car, solar and clean energy</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }


    /* VIDEO DE FONDO */

    main {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      z-index: 0;
    }

    video {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* HEADER */

    header {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;

      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      color: blanchedalmond;

      padding: 10px 20px;
    }

    header img {
      filter: brightness(1000);
      width: 200px;
    }


    nav {
      display: flex;
    }

    ul {
      list-style: none;

      display: flex;

      margin: 0;
      padding: 0;
    }

    li {
      margin: 15px;
    }


    /* TEXTO CENTRAL */

    section {
      position: absolute;

      top: 100px;
      left: 0;

      width: 100%;

      z-index: 10;

      text-align: center;

      color: blanchedalmond;
    }


    /* BOTÓN */

    #section2 {
      top: auto;
      bottom: 60px;
    }

    button {
      border: 2px solid blanchedalmond;

      background-color: transparent;

      padding: 12px 25px;

      border-radius: 5px;

      color: blanchedalmond;

      cursor: pointer;
    }

  </style>
</head>


<body>


  <main>

    <video autoplay muted loop playsinline>

      <source
        src="./video tesla (1).mp4"
        type="video/mp4"
      />

    </video>

  </main>


  <header>

    <img
      src="./tesla remove img.png"
      alt="Logo de Tesla"
    />


    <nav>

      <ul id="menu1">

        <li>Model S</li>
        <li>Model 3</li>
        <li>Model X</li>
        <li>Model Y</li>
        <li>Solar Roof</li>
        <li>Solar Panel</li>
        <li>Powerwall</li>

      </ul>

    </nav>


    <nav>

      <ul id="menu2">

        <li>Shop</li>
        <li>Account</li>
        <li>Menu</li>

      </ul>

    </nav>

  </header>



  <section>

    <h1>Experience Tesla</h1>

    <h2>Schedule a Demo Drive</h2>

  </section>



  <section id="section2">

    <button>Demo Drive</button>

  </section>


</body>

</html>
